[project]
name = "agent-rosario"
version = "0.1.0"
description = "Agente conversacional sobre datos abiertos de Rosario"
readme = "README.md"
authors = [
    { name = "ivan orquera", email = "ivanorquera9@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-cloud-bigquery>=3.45.2",
    "google-cloud-vision>=3.15.0",
    "openai>=3.14.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
