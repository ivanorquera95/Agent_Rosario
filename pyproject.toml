[project]
name = "agent-rosario"
version = "0.1.0"
description = "Agente conversacional sobre datos abiertos de Rosario"
readme = "README.md"
authors = [
    { name = "ivan orquera", email = "ivanorquera9@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.14.0",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
